name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode debug keystore (only when the secret is available)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.jks"
            echo "VR_KEYSTORE_FILE=$RUNNER_TEMP/debug.jks" >> "$GITHUB_ENV"
            echo "VR_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "VR_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "VR_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: using the default Android debug key."
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Show APK signer fingerprint
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: victorrecovery-companion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
